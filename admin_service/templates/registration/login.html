{% extends "base.html" %}
{% block title %}Admin Login — EduResult Portal{% endblock %}
{% block auth_content %}
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-brand">
      <i class="fa-solid fa-graduation-cap"></i>
      <h2>EduResult Portal</h2>
      <p>Admin Management Service</p>
    </div>
    {% if form.errors %}
      <div class="alert alert-danger">Invalid username or password. Please try again.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control form-control-lg" placeholder="admin" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100">
        <i class="fa-solid fa-right-to-bracket"></i> Login
      </button>
      <input type="hidden" name="next" value="{{ next }}">
    </form>
    <a href="{{ STUDENT_PORTAL_URL|default:'http://localhost:8000' }}" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Back to Student Portal
    </a>
  </div>
</div>
{% endblock %}
