{% extends "base.html" %}
{% block page_title %}Add Result{% endblock %}
{% block content %}
<div class="panel form-panel">
  <h5><i class="fa-solid fa-square-plus"></i> Add Result — Step 1: Select Student</h5>
  <form method="post" novalidate>
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">{{ form.student.label }}</label>
      {{ form.student }}
      {% if form.student.errors %}<div class="text-danger small mt-1">{{ form.student.errors|striptags }}</div>{% endif %}
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary"><i class="fa-solid fa-arrow-right"></i> Continue</button>
      <a href="{% url 'result_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
