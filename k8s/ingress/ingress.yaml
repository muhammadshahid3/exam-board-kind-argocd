# =========================================================
# STUDENT STATIC FILES
# =========================================================

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: student-static-ingress
  namespace: exam-board

  annotations:
    argocd.argoproj.io/sync-wave: "6"

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:

          # /static/... -> student-service
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: student-service
                port:
                  number: 8000