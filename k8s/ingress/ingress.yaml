apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-ingress
  namespace: exam-board
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  number: 8001

          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  number: 8001

          - path: /login
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  number: 8001

          - path: /logout
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  number: 8001

          - path: /static
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  number: 8001

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: student-ingress
  namespace: exam-board
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /student
            pathType: Prefix
            backend:
              service:
                name: student-service
                port:
                  number: 8000