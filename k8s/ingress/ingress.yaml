# =========================================================
# ADMIN INGRESS
# =========================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-ingress
  namespace: exam-board

  annotations:
    argocd.argoproj.io/sync-wave: "6"

    # /admin/... -> /...
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:

          # -----------------------------------------------
          # ADMIN APPLICATION
          # /admin       -> /
          # /admin/login -> /login
          # /admin/dashboard -> /dashboard
          # -----------------------------------------------
          - path: /admin(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: admin-service
                port:
                  number: 8001


# =========================================================
# STUDENT INGRESS
# =========================================================

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: student-ingress
  namespace: exam-board

  annotations:
    argocd.argoproj.io/sync-wave: "6"

    # /student/... -> /...
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:

          # -----------------------------------------------
          # STUDENT APPLICATION
          # /student       -> /
          # /student/login -> /login
