services:
  db:
    image: postgres:16
    container_name: exam_results_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exam_results}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-exam_results}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - exam_net

  admin_service:
    build:
      context: ./admin_service
    container_name: exam_admin_service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exam_results}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-this-secret-key}
      DEBUG: ${DEBUG:-True}
      STUDENT_PORTAL_URL: ${STUDENT_PORTAL_URL:-http://localhost:8000}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-Admin@12345}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.com}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - exam_net

  student_service:
    build:
      context: ./student_service
    container_name: exam_student_service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exam_results}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-this-secret-key}
      DEBUG: ${DEBUG:-True}
      ADMIN_PORTAL_URL: ${ADMIN_PORTAL_URL:-http://localhost:8001}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      admin_service:
        condition: service_started
    networks:
      - exam_net

volumes:
  postgres_data:

networks:
  exam_net:
    driver: bridge
