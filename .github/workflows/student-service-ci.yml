name: student-service CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'student_service/**'
      - '.github/workflows/student-service-ci.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./studentcode
          push: true
          tags: |
            shahiddevops1/exam-result-system-student_service:latest
            shahiddevops1/exam-result-system-student_service:${{ github.sha }}